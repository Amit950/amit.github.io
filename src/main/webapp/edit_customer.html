<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
    <style>
        body{font-family:Arial, sans-serif; margin:40px;}
        form{max-width:400px; margin:auto;}
        input{display:block; margin:10px 0; width:100%; padding:8px;}
        .error{color:red;}
    </style>
</head>
<body>
<h2>Edit Customer</h2>
<form id="editForm">
    <input type="text" id="ssn" placeholder="SSN" readonly>
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Save</button>
    <div class="error" id="error"></div>
</form>
<script>
function getSSN(){const params=new URLSearchParams(window.location.search);return params.get('ssn');}
async function load(){
    const ssn=getSSN();
    const res=await fetch('getCustomer?ssn='+ssn);
    const c=await res.json();
    document.getElementById('ssn').value=c.ssn;
    document.getElementById('name').value=c.name;
    document.getElementById('email').value=c.email;
}
load();
document.getElementById('editForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const ssn=document.getElementById('ssn').value;
    const name=document.getElementById('name').value.trim();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value.trim();
    if(!name||!email||!password){
        document.getElementById('error').textContent='All fields required';
        return;
    }
    const res=await fetch('editCustomer',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ssn,name,email,password})
    });
    const data=await res.json();
    if(data.success){alert('Updated');}
    else document.getElementById('error').textContent=data.message||'Error';
});
</script>
</body>
</html>
