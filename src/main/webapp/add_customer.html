<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <style>
        body{font-family:Arial, sans-serif; margin:40px;}
        form{max-width:400px; margin:auto;}
        input{display:block; margin:10px 0; width:100%; padding:8px;}
        .error{color:red;}
    </style>
</head>
<body>
<h2>Add Customer</h2>
<form id="addForm">
    <input type="text" id="ssn" placeholder="SSN" required>
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Add</button>
    <div class="error" id="error"></div>
</form>
<script>
    document.getElementById('addForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const ssn=document.getElementById('ssn').value.trim();
        const name=document.getElementById('name').value.trim();
        const email=document.getElementById('email').value.trim();
        const password=document.getElementById('password').value.trim();
        if(!/^[0-9]{9}$/.test(ssn)){
            document.getElementById('error').textContent='Invalid SSN';
            return;
        }
        if(!name||!email||!password){
            document.getElementById('error').textContent='All fields required';
            return;
        }
        const res=await fetch('addCustomer',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ssn,name,email,password})
        });
        const data=await res.json();
        if(data.success){
            alert('Customer added');
        }else{
            document.getElementById('error').textContent=data.message||'Error';
        }
    });
</script>
</body>
</html>
